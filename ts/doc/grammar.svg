<svg xmlns="http://www.w3.org/2000/svg" class="railroad" width="287" height="212" viewBox="0 0 287 212"><style>svg.railroad{background:#fff;font-family:monospace;font-size:13px}.rr-line{stroke:#334;stroke-width:2;fill:none}.rr-cap{fill:#334}.rr-term{fill:#e8f0ff;stroke:#334;stroke-width:2}.rr-nonterm{fill:#fff7e8;stroke:#334;stroke-width:2}.rr-label{fill:#111;text-anchor:middle;dominant-baseline:middle}.rr-comment{fill:#666;font-style:italic;text-anchor:middle;dominant-baseline:middle}.rr-title{fill:#113;font-weight:bold;font-size:15px}.rr-legend{fill:#333;font-size:12px}.rr-legend-tok{fill:#113;font-weight:bold}a:hover .rr-nonterm{fill:#ffe6b3;cursor:pointer}</style><g><g id="markdown"><text class="rr-title" x="16" y="31">markdown</text><circle class="rr-cap" cx="24" cy="42" r="3"/><path class="rr-line" d="M24 42V56"/><path class="rr-line" d="M24 56V68"/><path class="rr-line" d="M24 68V82"/><circle class="rr-cap" cx="24" cy="82" r="3"/></g><text class="rr-title" x="16" y="131">Ignored tokens</text><text class="rr-legend" x="16" y="153"><tspan class="rr-legend-tok">CM</tspan>  —  comment</text><text class="rr-legend" x="16" y="171"><tspan class="rr-legend-tok">LN</tspan>  —  newline (line break)</text><text class="rr-legend" x="16" y="189"><tspan class="rr-legend-tok">SP</tspan>  —  whitespace (spaces or tabs)</text></g></svg>