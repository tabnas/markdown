<svg xmlns="http://www.w3.org/2000/svg" class="railroad" width="535" height="304" viewBox="0 0 535 304"><style>svg.railroad{background:#fff;font-family:monospace;font-size:13px}.rr-line{stroke:#334;stroke-width:2;fill:none}.rr-cap{fill:#334}.rr-term{fill:#e8f0ff;stroke:#334;stroke-width:2}.rr-nonterm{fill:#fff7e8;stroke:#334;stroke-width:2}.rr-label{fill:#111;text-anchor:middle;dominant-baseline:middle}.rr-comment{fill:#666;font-style:italic;text-anchor:middle;dominant-baseline:middle}.rr-title{fill:#113;font-weight:bold;font-size:15px}.rr-legend{fill:#333;font-size:12px}.rr-legend-tok{fill:#113;font-weight:bold}a:hover .rr-nonterm{fill:#ffe6b3;cursor:pointer}</style><g><g id="markdown"><text class="rr-title" x="16" y="31">markdown</text><circle class="rr-cap" cx="42" cy="42" r="3"/><path class="rr-line" d="M42 42V56"/><a href="#line"><rect class="rr-nonterm" x="16" y="56" width="52" height="26" rx="4" ry="4"/><text class="rr-label" x="42" y="69">line</text></a><path class="rr-line" d="M42 82V96"/><circle class="rr-cap" cx="42" cy="96" r="3"/></g><g id="line"><text class="rr-title" x="116" y="31">line</text><circle class="rr-cap" cx="134" cy="42" r="3"/><path class="rr-line" d="M134 42V56"/><rect class="rr-term" x="116" y="56" width="36" height="26" rx="13" ry="13"/><text class="rr-label" x="134" y="69">LB</text><path class="rr-line" d="M134 82V96"/><circle class="rr-cap" cx="134" cy="96" r="3"/></g><text class="rr-title" x="16" y="145">Tokens</text><text class="rr-legend" x="16" y="167"><tspan class="rr-legend-tok">LB</tspan>  —  one physical line (text, blank and table-arming bits in use)</text><text class="rr-title" x="16" y="223">Ignored tokens</text><text class="rr-legend" x="16" y="245"><tspan class="rr-legend-tok">CM</tspan>  —  comment</text><text class="rr-legend" x="16" y="263"><tspan class="rr-legend-tok">LN</tspan>  —  newline (line break)</text><text class="rr-legend" x="16" y="281"><tspan class="rr-legend-tok">SP</tspan>  —  whitespace (spaces or tabs)</text></g></svg>