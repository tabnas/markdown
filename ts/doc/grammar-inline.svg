<svg xmlns="http://www.w3.org/2000/svg" class="railroad" width="846" height="574" viewBox="0 0 846 574"><style>svg.railroad{background:#fff;font-family:monospace;font-size:13px}.rr-line{stroke:#334;stroke-width:2;fill:none}.rr-cap{fill:#334}.rr-term{fill:#e8f0ff;stroke:#334;stroke-width:2}.rr-nonterm{fill:#fff7e8;stroke:#334;stroke-width:2}.rr-label{fill:#111;text-anchor:middle;dominant-baseline:middle}.rr-comment{fill:#666;font-style:italic;text-anchor:middle;dominant-baseline:middle}.rr-title{fill:#113;font-weight:bold;font-size:15px}.rr-legend{fill:#333;font-size:12px}.rr-legend-tok{fill:#113;font-weight:bold}a:hover .rr-nonterm{fill:#ffe6b3;cursor:pointer}</style><g><g id="inline"><text class="rr-title" x="16" y="31">inline</text><circle class="rr-cap" cx="423" cy="42" r="3"/><path class="rr-line" d="M423 42V56"/><path class="rr-line" d="M423 56V74"/><path class="rr-line" d="M38 74H808"/><path class="rr-line" d="M38 136H808"/><path class="rr-line" d="M423 136V154"/><path class="rr-line" d="M38 74V92"/><rect class="rr-term" x="16" y="92" width="44" height="26" rx="13" ry="13"/><text class="rr-label" x="38" y="105">IBK</text><path class="rr-line" d="M38 118V136"/><path class="rr-line" d="M108 74V92"/><rect class="rr-term" x="86" y="92" width="44" height="26" rx="13" ry="13"/><text class="rr-label" x="108" y="105">IES</text><path class="rr-line" d="M108 118V136"/><path class="rr-line" d="M178 74V92"/><rect class="rr-term" x="156" y="92" width="44" height="26" rx="13" ry="13"/><text class="rr-label" x="178" y="105">ICS</text><path class="rr-line" d="M178 118V136"/><path class="rr-line" d="M248 74V92"/><rect class="rr-term" x="226" y="92" width="44" height="26" rx="13" ry="13"/><text class="rr-label" x="248" y="105">IDL</text><path class="rr-line" d="M248 118V136"/><path class="rr-line" d="M318 74V92"/><rect class="rr-term" x="296" y="92" width="44" height="26" rx="13" ry="13"/><text class="rr-label" x="318" y="105">IOB</text><path class="rr-line" d="M318 118V136"/><path class="rr-line" d="M388 74V92"/><rect class="rr-term" x="366" y="92" width="44" height="26" rx="13" ry="13"/><text class="rr-label" x="388" y="105">IBG</text><path class="rr-line" d="M388 118V136"/><path class="rr-line" d="M458 74V92"/><rect class="rr-term" x="436" y="92" width="44" height="26" rx="13" ry="13"/><text class="rr-label" x="458" y="105">ICB</text><path class="rr-line" d="M458 118V136"/><path class="rr-line" d="M528 74V92"/><rect class="rr-term" x="506" y="92" width="44" height="26" rx="13" ry="13"/><text class="rr-label" x="528" y="105">IAL</text><path class="rr-line" d="M528 118V136"/><path class="rr-line" d="M598 74V92"/><rect class="rr-term" x="576" y="92" width="44" height="26" rx="13" ry="13"/><text class="rr-label" x="598" y="105">IHT</text><path class="rr-line" d="M598 118V136"/><path class="rr-line" d="M668 74V92"/><rect class="rr-term" x="646" y="92" width="44" height="26" rx="13" ry="13"/><text class="rr-label" x="668" y="105">IEN</text><path class="rr-line" d="M668 118V136"/><path class="rr-line" d="M738 74V92"/><rect class="rr-term" x="716" y="92" width="44" height="26" rx="13" ry="13"/><text class="rr-label" x="738" y="105">ITX</text><path class="rr-line" d="M738 118V136"/><path class="rr-line" d="M808 74V92"/><rect class="rr-term" x="786" y="92" width="44" height="26" rx="13" ry="13"/><text class="rr-label" x="808" y="105">ILI</text><path class="rr-line" d="M808 118V136"/><path class="rr-line" d="M423 154V168"/><circle class="rr-cap" cx="423" cy="168" r="3"/></g><text class="rr-title" x="16" y="217">Tokens</text><text class="rr-legend" x="16" y="239"><tspan class="rr-legend-tok">IAL</tspan>  —  angle autolink</text><text class="rr-legend" x="16" y="257"><tspan class="rr-legend-tok">IBG</tspan>  —  image opener ![</text><text class="rr-legend" x="16" y="275"><tspan class="rr-legend-tok">IBK</tspan>  —  line break (soft or hard)</text><text class="rr-legend" x="16" y="293"><tspan class="rr-legend-tok">ICB</tspan>  —  closer ] (with any 