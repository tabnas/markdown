[package]
name = "tabnas-markdown"
version = "0.7.5"
edition = "2021"
rust-version = "1.85"
authors = ["Richard Rodger <http://richardrodger.com>"]
description = "A CommonMark 0.31.2 parser with GFM extensions for the tabnas parsing engine, into a JSON AST or HTML."
license = "MIT"
repository = "https://github.com/tabnas/markdown"
readme = "README.md"
keywords = ["markdown", "commonmark", "gfm", "parser", "tabnas"]
categories = ["parsing", "text-processing"]

[lib]
name = "tabnas_markdown"
path = "src/lib.rs"

[dependencies]
# The engine is consumed as a SIBLING CHECKOUT, the standard tabnas
# development model: clone https://github.com/tabnas/parser next to this
# repo. The `tabnas` crate is not published, so there is no registry
# version to fall back on. It is the only runtime tabnas dependency, and
# only src/lib.rs, src/engine_block.rs and src/engine_inline.rs import
# it: everything reachable from src/commonmark.rs is engine-free.
tabnas = { path = "../../parser/rs" }
indexmap = { version = "2.2", features = ["serde"] }
regex = "1.10"
serde_json = { version = "1.0", features = ["preserve_order"] }

[dev-dependencies]
# The shared fixture runner: the same test/spec/*.tsv loader, escape
# codec and comparison the TypeScript and Go suites use.
tabnas-support = { path = "../../support/rs", features = ["serde_json"] }
